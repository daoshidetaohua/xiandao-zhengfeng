<script>
// ============================================================
//  TOURNAMENT: 群仙乱斗 — 6人淘汰赛
// ============================================================

let tournament = null;
let tournamentMatchRef = null;
let tournamentAIDifficulty = 1;

const TOURNAMENT_AI_NAMES = [
  '散修张三','散修李四','散修王五','散修赵六','散修陈七'
];

// TOURNAMENT: Initialize tournament with human's school choice
function initTournament(humanSchool) {
  const allSchools = Object.keys(SCHOOLS);
  const usedSchools = [humanSchool];
  tournament = {
    players: [],
    round: 0,
    matches: [],
    currentMatch: null,
    currentMatchRef: null,
    currentRoundPairs: [],
    currentPairIndex: 0,
    byePlayer: null,
    phase: 'lobby'
  };
  // Human player
  tournament.players.push({
    name: '你',
    school: humanSchool,
    bigHP: 100, maxBigHP: 100, alive: true,
    human: true, ai: false, aiLevel: 0
  });
  // AI players (5 more)
  const aiNames = [...TOURNAMENT_AI_NAMES];
  shuffle(aiNames);
  for(let i = 0; i < 5; i++){
    const remaining = allSchools.filter(s => !usedSchools.includes(s));
    let aiSchool;
    if(remaining.length > 0){
      aiSchool = remaining[Math.floor(Math.random() * remaining.length)];
    } else {
      aiSchool = allSchools[Math.floor(Math.random() * allSchools.length)];
    }
    usedSchools.push(aiSchool);
    tournament.players.push({
      name: aiNames[i],
      school: aiSchool,
      bigHP: 100, maxBigHP: 100, alive: true,
      human: false, ai: true,
      aiLevel: tournamentAIDifficulty
    });
  }
}

// TOURNAMENT: Show tournament lobby
function showTournamentLobby() {
  document.getElementById('selectScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('lobbyScreen').style.display = 'none';
  document.getElementById('tournamentLobby').style.display = 'flex';
  document.getElementById('tournamentResult').style.display = 'none';
  tournament = null;
  tournamentMatchRef = null;
  renderTournamentLobby();
}

// TOURNAMENT: Render lobby content
function renderTournamentLobby() {
  const container = document.getElementById('tournamentPlayerSlots');
  const startBtn = document.getElementById('btnTournamentStart');
  if(!tournament){
    // Show school picker
    container.innerHTML = '<div style="color:#a09080;font-size:0.85rem;margin-bottom:8px">🏯 选择你的宗门（其他选手自动填充）：</div><div class="schoolSelect" id="tournamentSchoolSelect"></div>';
    const selDiv = document.getElementById('tournamentSchoolSelect');
    Object.entries(SCHOOLS).forEach(([key, sc]) => {
      const opt = document.createElement('button');
      opt.className = 'schoolOption';
      opt.textContent = sc.icon + ' ' + sc.name;
      opt.onclick = () => {
        document.querySelectorAll('#tournamentSchoolSelect .schoolOption').forEach(el => el.classList.remove('chosen'));
        opt.classList.add('chosen');
        initTournament(key);
        renderTournamentLobby();
      };
      selDiv.appendChild(opt);
    });
    startBtn.style.display = 'none';
  } else {
    // Show 6 player slots
    let html = '<div class="tournamentGrid">';
    tournament.players.forEach(p => {
      const sc = SCHOOLS[p.school];
      const hpPct = (p.bigHP / p.maxBigHP) * 100;
      html += '<div class="tournamentSlot ' + (p.alive?'':'dead') + ' ' + (p.human?'human':'') + '">' +
        '<div class="tSlotIcon">' + (p.human?'🧑':'🤖') + ' ' + (sc?sc.icon:'❓') + '</div>' +
        '<div class="tSlotName">' + p.name + '</div>' +
        '<div class="tSlotSchool">' + (sc?sc.name:'未知') + '</div>' +
        '<div class="tSlotHpBarWrap"><div class="tSlotHpFill" style="width:' + hpPct + '%"></div></div>' +
        '<div class="tSlotHpText">' + p.bigHP + '/' + p.maxBigHP + '</div>' +
        (!p.alive?'<div class="tSlotDead">💀 已淘汰</div>':'') +
        '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
    startBtn.style.display = 'block';
  }
}

// TOURNAMENT: Start the tournament
function startTournament() {
  if(!tournament) return;
  tournament.round = 0;
  tournament.matches = [];
  tournament.phase = 'match';
  tournament.players.forEach(p => { p.bigHP = p.maxBigHP; p.alive = true; });
  tournamentNextRound();
}

// TOURNAMENT: Proceed to next round
function tournamentNextRound() {
  if(!tournament) return;
  const alive = tournament.players.filter(p => p.alive);
  if(alive.length <= 1){
    showTournamentChampion();
    return;
  }
  tournament.round++;
  tournament.phase = 'match';
  shuffle(alive);
  tournament.currentRoundPairs = [];
  for(let i = 0; i < alive.length - 1; i += 2){
    tournament.currentRoundPairs.push({ p1: alive[i], p2: alive[i+1] });
  }
  tournament.currentPairIndex = 0;
  tournament.byePlayer = null;
  if(alive.length % 2 !== 0){
    tournament.byePlayer = alive[alive.length - 1];
  }
  showTournamentPairing();
}

// TOURNAMENT: Show round pairing screen
function showTournamentPairing() {
  document.getElementById('tournamentLobby').style.display = 'none';
  document.getElementById('tournamentResult').style.display = 'flex';

  document.getElementById('tournamentResultTitle').textContent = '⚔️ 群仙乱斗 — 第' + tournament.round + '轮';

  let html = '<div class="tPairing">';
  tournament.currentRoundPairs.forEach((pair, idx) => {
    const s1 = SCHOOLS[pair.p1.school];
    const s2 = SCHOOLS[pair.p2.school];
    const active = (idx === tournament.currentPairIndex);
    html += '<div class="tPairRow' + (active?' active':'') + '">' +
      '<span class="tPairIcon">' + (s1?s1.icon:'❓') + '</span>' +
      '<span class="tPairName">' + pair.p1.name + '</span>' +
      '<span class="tPairVS">🗡️ VS 🗡️</span>' +
      '<span class="tPairName">' + pair.p2.name + '</span>' +
      '<span class="tPairIcon">' + (s2?s2.icon:'❓') + '</span>' +
      (active?'<span class="tPairStatus">⚔️ 对战中...</span>':'') +
      '</div>';
  });
  if(tournament.byePlayer){
    html += '<div class="tPairRow bye"><span>' + (SCHOOLS[tournament.byePlayer.school]?.icon||'❓') + '</span><span>' + tournament.byePlayer.name + '</span><span style="color:#60c060">🔄 轮空自动晋级</span></div>';
  }
  html += '</div>';
  document.getElementById('tournamentMatchResult').innerHTML = html;
  document.getElementById('tournamentStandings').innerHTML = '';
  document.getElementById('btnTournamentNextRound').style.display = 'none';
  document.getElementById('btnTournamentFinish').style.display = 'none';

  // Start first match after delay
  if(tournament.currentRoundPairs.length > 0){
    setTimeout(function(){ tournamentStartMatch(tournament.currentRoundPairs[0]); }, 1000);
  }
}

// TOURNAMENT: Start a 1v1 match
function tournamentStartMatch(pair) {
  if(!pair || !pair.p1 || !pair.p2) return;
  tournament.currentMatch = pair;
  tournament.currentMatchRef = { p1: pair.p1, p2: pair.p2 };
  game = null; // 清除上一场游戏状态

  var p1 = pair.p1, p2 = pair.p2;
  
  // AI vs AI: 后台模拟，不显示战斗画面
  if(!p1.human && !p2.human) {
    document.getElementById('tournamentResult').style.display = 'flex';
    document.getElementById('tournamentMatchResult').innerHTML = '<div style="text-align:center;color:#a09080;padding:20px">⚔️ ' + p1.name + ' VS ' + p2.name + ' 对战中...</div>';
    simulateAIMatch(pair);
    return;
  }

  document.getElementById('tournamentResult').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  var humanSchool, aiSchool, aiLevel;
  var isHumanP1 = false;

  if(p1.human){ humanSchool = p1.school; aiSchool = p2.school; aiLevel = p2.aiLevel||1; isHumanP1 = true; }
  else if(p2.human){ humanSchool = p2.school; aiSchool = p1.school; aiLevel = p1.aiLevel||1; isHumanP1 = false; }
  else { humanSchool = p1.school; aiSchool = p2.school; aiLevel = p2.aiLevel||1; isHumanP1 = true; }

  tournament.currentMatchRef.isHumanP1 = isHumanP1;

  // Create the game
  newGame(humanSchool, aiLevel, aiSchool, 'tournament');
  // Set names for display
  game.p.name = isHumanP1 ? p1.name : p2.name;
  game.e.name = isHumanP1 ? p2.name : p1.name;

  // BIGHP: sync bigHP from tournament data
  game.p.bigHP = (isHumanP1 ? p1 : p2).bigHP;
  game.p.maxBigHP = (isHumanP1 ? p1 : p2).maxBigHP;
  game.e.bigHP = (isHumanP1 ? p2 : p1).bigHP;
  game.e.maxBigHP = (isHumanP1 ? p2 : p1).maxBigHP;

  // AI vs AI: auto-play after creating game
  if(!p1.human && !p2.human){
    setTimeout(function(){ endPlayerTurn(); }, 600);
  }
}

// 后台模拟AI对战（跳过战斗画面，快速结算）
function simulateAIMatch(pair) {
  var p1 = pair.p1, p2 = pair.p2;
  var humanSchool = p1.school;
  var aiSchool = p2.school;
  var aiLevel = p2.aiLevel || 1;
  
  // 快速模拟：直接计算胜负
  // 基于大血条(BigHP)和宗门相性决定胜负概率
  var p1Power = (p1.bigHP || 100) + (p1.aiLevel || 0) * 10;
  var p2Power = (p2.bigHP || 100) + (p2.aiLevel || 0) * 10;
  p1Power += (3 - p1Power % 3) * Math.floor(Math.random() * 5);
  p2Power += (3 - p2Power % 3) * Math.floor(Math.random() * 5);
  
  // 基于战斗回合模拟
  var rounds = 5 + Math.floor(Math.random() * 10);
  var hpDiff = Math.abs(Math.floor((p1Power - p2Power) * 0.3));
  hpDiff = Math.max(0, Math.min(20, hpDiff));
  
  // 随机胜负（强方胜率高）
  var p1WinChance = p1Power / (p1Power + p2Power) * 0.7 + 0.15;
  var p1Won = Math.random() < p1WinChance;
  
  // 构造简易game对象
  var winner, loser;
  if(p1Won) { winner = p1; loser = p2; }
  else { winner = p2; loser = p1; }
  
  // 大血条伤害
  var damage = 10 + (rounds * 2) + Math.max(0, 12 - hpDiff);
  var finalDamage = Math.max(12, Math.min(40, Math.floor(damage)));
  loser.bigHP = Math.max(0, loser.bigHP - finalDamage);
  
  // 记录比赛
  tournament.matches.push({
    round: tournament.round,
    p1Name: p1.name, p2Name: p2.name,
    winnerName: winner.name, loserName: loser.name,
    winnerSchool: winner.school, loserSchool: loser.school,
    rounds: rounds, hpDiff: hpDiff,
    bigHPDamage: finalDamage, eliminated: loser.bigHP <= 0
  });
  
  if(loser.bigHP <= 0) { loser.alive = false; }
  
  tournament.phase = 'result';
  
  // 1.5秒后显示结果
  setTimeout(function() {
    showTournamentMatchResult();
  }, 800);
}

// TOURNAMENT: Handle match end (called from endGame)
function tournamentEndMatch(g) {
  if(!tournament || !tournament.currentMatchRef) return;
  var ref = tournament.currentMatchRef;
  var p1 = ref.p1, p2 = ref.p2;
  var isHumanP1 = ref.isHumanP1;

  // Determine winner/loser
  // TOURNAMENTFIX: account for autoPlayPlayerAI swap
  var humanWon = (g.winner === (g._swapActive ? g.e : g.p));
  var winner, loser;
  if(isHumanP1){ winner = humanWon ? p1 : p2; loser = humanWon ? p2 : p1; }
  else { winner = humanWon ? p2 : p1; loser = humanWon ? p1 : p2; }

  // Calculate big HP damage
  var rounds = g.turnCount || 1;
  var hpDiff = Math.abs(g.p.hp - g.e.hp);
  var damage = 10 + (rounds * 2) + Math.max(0, 12 - hpDiff);
  var finalDamage = Math.max(12, Math.min(40, damage));

  // Apply damage to loser's big HP
  loser.bigHP = Math.max(0, loser.bigHP - finalDamage);
  var eliminated = false;
  if(loser.bigHP <= 0){ loser.alive = false; eliminated = true; }

  // Record match
  tournament.matches.push({
    round: tournament.round,
    p1Name: p1.name, p2Name: p2.name,
    winnerName: winner.name, loserName: loser.name,
    winnerSchool: winner.school, loserSchool: loser.school,
    rounds: rounds, hpDiff: hpDiff,
    bigHPDamage: finalDamage, eliminated: eliminated
  });

  tournament.phase = 'result';
  showTournamentMatchResult();
}

// TOURNAMENT: Show match result
function showTournamentMatchResult() {
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('tournamentResult').style.display = 'flex';

  var lastMatch = tournament.matches[tournament.matches.length - 1];
  document.getElementById('tournamentResultTitle').textContent = '⚔️ 群仙乱斗 — 第' + tournament.round + '轮';

  var wSc = SCHOOLS[lastMatch.winnerSchool];
  var lSc = SCHOOLS[lastMatch.loserSchool];

  document.getElementById('tournamentMatchResult').innerHTML =
    '<div class="tResultCard">' +
    '<div class="tResultPair">' +
    '<span class="tRIcon">' + (wSc?wSc.icon:'❓') + '</span>' +
    '<span class="tRName winner">' + lastMatch.winnerName + '</span>' +
    '<span class="tRVS">🏆 战胜 🗡️</span>' +
    '<span class="tRName loser">' + lastMatch.loserName + '</span>' +
    '<span class="tRIcon">' + (lSc?lSc.icon:'❓') + '</span>' +
    '</div>' +
    '<div class="tResultDetail">' +
    '<div>⚔️ 经过 ' + lastMatch.rounds + ' 回合的激战</div>' +
    '<div>💔 ' + lastMatch.loserName + ' 大血条 -' + lastMatch.bigHPDamage + '</div>' +
    (lastMatch.eliminated ? '<div class="tEliminated">💀 ' + lastMatch.loserName + ' 被淘汰！</div>' : '') +
    '</div></div>';

  renderTournamentStandings();

  var alive = tournament.players.filter(function(p){ return p.alive; });
  // TOURNAMENTFIX: Handle next-match / next-round flow
  var hasNextMatch = tournament.currentPairIndex < tournament.currentRoundPairs.length - 1;
  var nextBtn = document.getElementById('btnTournamentNextRound');
  var finishBtn = document.getElementById('btnTournamentFinish');

  if(hasNextMatch) {
    nextBtn.style.display = 'block';
    nextBtn.textContent = '➡️ 下一场';
    nextBtn.onclick = function() {
      tournament.currentPairIndex++;
      tournamentStartMatch(tournament.currentRoundPairs[tournament.currentPairIndex]);
    };
  } else {
    nextBtn.style.display = (alive.length > 1) ? 'block' : 'none';
    nextBtn.textContent = '➡️ 下一轮';
    nextBtn.onclick = tournamentNextRound;
  }
  finishBtn.style.display = (alive.length <= 1) ? 'block' : 'none';

  // 仅AI vs AI才自动推进，人类对战后需手动点击
  var matchRef = tournament.currentMatchRef;
  var isAIMatch = matchRef && !matchRef.p1.human && !matchRef.p2.human;
  if(hasNextMatch && isAIMatch) {
    setTimeout(function() {
      tournament.currentPairIndex++;
      tournamentStartMatch(tournament.currentRoundPairs[tournament.currentPairIndex]);
    }, 1500);
  } else if(isAIMatch && alive.length > 1) {
    setTimeout(function() { tournamentNextRound(); }, 1200);
  }
  html += '</div>';
  container.innerHTML = html;
}

// TOURNAMENT: Show champion
function showTournamentChampion() {
  document.getElementById('tournamentLobby').style.display = 'none';
  document.getElementById('tournamentResult').style.display = 'flex';

  var champion = tournament.players.find(function(p){ return p.alive; });
  var chSc = champion ? SCHOOLS[champion.school] : null;

  document.getElementById('tournamentResultTitle').textContent = '🏆 冠军诞生！';

  document.getElementById('tournamentMatchResult').innerHTML =
    '<div class="tChampionBanner">' +
    '<div class="tChampCrown">👑</div>' +
    '<div class="tChampIcon">' + (chSc?chSc.icon:'🏆') + '</div>' +
    '<div class="tChampName">' + (champion?champion.name:'???') + '</div>' +
    '<div class="tChampSchool">' + (chSc?chSc.name:'???') + '</div>' +
    '<div class="tChampDesc">经过 ' + tournament.round + ' 轮激战，最终登顶！</div>' +
    '<div class="tChampStats">' + (champion ? '剩余大血条：' + champion.bigHP + '/' + champion.maxBigHP : '') + '</div>' +
    '</div>';

  document.getElementById('tournamentStandings').innerHTML = '';
  renderTournamentStandings();
  document.getElementById('btnTournamentNextRound').style.display = 'none';
  document.getElementById('btnTournamentFinish').style.display = 'block';
}

// TOURNAMENT: Clean up and return
function finishTournament() {
  tournament = null;
  tournamentMatchRef = null;
  game = null;
  document.getElementById('tournamentResult').style.display = 'none';
  document.getElementById('tournamentLobby').style.display = 'none';
  showSelect();
}

// ============================================================
//  TOURNAMENT: end
// ============================================================
//  TOURNAMENT: end
// ============================================================
</script>

<!-- VFX: Canvas 粒子系统与特效函数 -->
<script>
// VFX: 全局开关 - 设为false可关闭所有特效
var VFX_ENABLED = true;

// VFX: Canvas粒子系统
(function(){
  var canvas = document.getElementById('particleCanvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var particles = [];
  var bgParticles = [];
  var shockwaves = [];
  var resizeTimer = null;

  // 性能优化：移动端限制粒子数
  var isMobile = window.innerWidth < 768;
  var MAX_PARTICLES = isMobile ? 80 : 200;
  var MAX_BG = isMobile ? 30 : 80;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 200);
  });
  resize();

  // 初始化背景星尘
  function initBg(count){
    bgParticles = [];
    for(var i=0; i<count; i++){
      bgParticles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*2+0.5,
        speedX: (Math.random()-0.5)*0.3,
        speedY: (Math.random()-0.5)*0.3-0.1,
        opacity: Math.random()*0.5+0.1,
        phase: Math.random()*Math.PI*2
      });
    }
  }

  // VFX: 粒子爆发函数
  window.spawnParticles = function(x, y, count, color, spread){
    if(!VFX_ENABLED) return;
    spread = spread || 120;
    var n = Math.min(count||10, 30);
    for(var i=0; i<n; i++){
      var angle = Math.random()*Math.PI*2;
      var speed = Math.random()*spread*0.03+1;
      particles.push({
        x:x, y:y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        life:1,
        decay:Math.random()*0.025+0.01,
        size:Math.random()*4+2,
        color:color||'#ffffff',
        gravity:0.02,
        friction:0.97
      });
    }
    // 粒子数限制
    if(particles.length > MAX_PARTICLES) particles = particles.slice(-MAX_PARTICLES);
  };

  // VFX: 环形冲击波
  window.spawnShockwave = function(x, y, color){
    if(!VFX_ENABLED) return;
    shockwaves.push({
      x:x, y:y,
      radius:5,
      maxRadius:Math.min(canvas.width,canvas.height)*0.5,
      life:1,
      color:color||'#ffd700',
      lineWidth:4
    });
  };

  // VFX: 全屏闪白
  window.flashScreen = function(duration){
    if(!VFX_ENABLED) return;
    duration = duration||300;
    var el = document.createElement('div');
    el.className = 'screen-flash';
    el.style.animationDuration = (duration/1000)+'s';
    document.body.appendChild(el);
    setTimeout(function(){el.remove();}, duration+100);
  };

  // VFX: 浮动光点 (DOM版)
  window.spawnFloatingOrbs = function(parent, count, color){
    if(!VFX_ENABLED||!parent) return;
    count = Math.min(count||5, 8);
    var origPos = parent.style.position;
    if(origPos!=='absolute'&&origPos!=='fixed') parent.style.position = 'relative';
    for(var i=0; i<count; i++){
      (function(){
        var size = Math.random()*8+4;
        var orb = document.createElement('div');
        orb.style.cssText = 'position:absolute;width:'+size+'px;height:'+size+'px;border-radius:50%;pointer-events:none;z-index:20;background:'+(color||'#60a0f0')+';box-shadow:0 0 6px '+(color||'#60a0f0')+';left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;opacity:0.7';
        parent.appendChild(orb);
        var startY = parseFloat(orb.style.top);
        var dur = Math.random()*800+800;
        var startTime = null;
        function anim(t){
          if(!startTime) startTime = t;
          var p = (t-startTime)/dur;
          if(p>=1){orb.remove();return;}
          orb.style.top = (startY - p*35)+'%';
          orb.style.opacity = 0.7*(1-p);
          orb.style.transform = 'translateX('+Math.sin(p*8)*8+'px)';
          requestAnimationFrame(anim);
        }
        requestAnimationFrame(anim);
      })();
    }
  };

  // 根据境界更新背景星尘数量
  window.updateBgParticles = function(realm){
    var count = Math.min(MAX_BG, 15 + (realm||0)*15);
    initBg(count);
  };

  // 护甲波动特效
  window.triggerArmorWave = function(){
    var badge = document.getElementById('playerArmorBadge');
    if(badge && badge.style.display!=='none'){
      badge.classList.remove('shield-wave');
      void badge.offsetWidth;
      badge.classList.add('shield-wave');
    }
  };

  // 动画循环
  var lastTime = 0;
  function loop(time){
    var dt = Math.min(time-lastTime, 50);
    lastTime = time;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // 背景星尘
    for(var i=bgParticles.length-1; i>=0; i--){
      var bp = bgParticles[i];
      bp.x += bp.speedX*(dt/16);
      bp.y += bp.speedY*(dt/16);
      bp.phase += 0.01;
      if(bp.x<-10) bp.x = canvas.width+10;
      if(bp.x>canvas.width+10) bp.x = -10;
      if(bp.y<-10) bp.y = canvas.height+10;
      if(bp.y>canvas.height+10) bp.y = -10;
      ctx.beginPath();
      ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(200,200,255,'+(bp.opacity*(0.7+0.3*Math.sin(bp.phase)))+')';
      ctx.fill();
    }

    // 活动粒子
    for(var i=particles.length-1; i>=0; i--){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= p.friction;
      p.vy *= p.friction;
      p.life -= p.decay;
      if(p.life<=0){particles.splice(i,1);continue;}
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 冲击波
    for(var i=shockwaves.length-1; i>=0; i--){
      var sw = shockwaves[i];
      sw.radius += 3;
      sw.life -= 0.025;
      if(sw.life<=0||sw.radius>sw.maxRadius){shockwaves.splice(i,1);continue;}
      ctx.globalAlpha = sw.life;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI*2);
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = sw.lineWidth*sw.life;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

  // 初始背景星尘
  setTimeout(function(){window.updateBgParticles(0);}, 200);
})();

// VFX: 境界变化时更新背景星尘
(function(){
  var origRenderAll = window.renderAll;
  if(origRenderAll){
    var original = origRenderAll;
    window.renderAll = function(){
      original();
      if(window.updateBgParticles && VFX_ENABLED && game){
        updateBgParticles(game.p.realm);
      }
    };
  }
})();

// VFX: 护甲变化检测
(function(){
  var origAddArmor = window.addArmor;
  if(origAddArmor){
    window.addArmor = function(g,target,n){
      origAddArmor(g,target,n);
      if(VFX_ENABLED && n>0 && target===g.p && typeof triggerArmorWave==='function'){
        triggerArmorWave();
      }
    };
  }
})();
</script>
</body>
</html>
